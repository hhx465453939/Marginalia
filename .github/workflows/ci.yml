name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Windows 默认 GBK 控制台；本项目输出全中文，必须强制 UTF-8
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    name: test / py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install (editable)
        run: python -m pip install -e .

      - name: Unit tests
        run: python -X utf8 -m unittest discover -s tests -t . -v

      - name: CLI smoke
        shell: bash
        run: |
          python -X utf8 -m marginalia --version
          rm -rf "$RUNNER_TEMP/mg" && mkdir -p "$RUNNER_TEMP/mg"
          printf '# 测试书\n\n## 第一章\n\n甲句在此处唯一出现。\n' > "$RUNNER_TEMP/mg/s.md"
          python -X utf8 -m marginalia --root "$RUNNER_TEMP/mg/study" init \
            --owner-open-id ou_test --owner-name 主人
          python -X utf8 -m marginalia --root "$RUNNER_TEMP/mg/study" book create \
            --as 主人 --title 测试书 --source "$RUNNER_TEMP/mg/s.md"
          python -X utf8 -m marginalia --root "$RUNNER_TEMP/mg/study" note add \
            --as 主人 --book 测试书 --kind ask \
            --anchor "甲句在此处唯一出现。" --text "冒烟测试"
          python -X utf8 -m marginalia --root "$RUNNER_TEMP/mg/study" verify \
            --check-render --strict
          python -X utf8 -m marginalia --root "$RUNNER_TEMP/mg/study" lint
          python -X utf8 -m marginalia --root "$RUNNER_TEMP/mg/study" doctor

  lint:
    name: lint / ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.6"
      - name: ruff check
        run: python -m ruff check . --output-format=github
      - name: ruff format check
        run: python -m ruff format --check --diff .

  typecheck:
    name: typecheck / mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "mypy>=1.10"
      - name: mypy
        run: python -m mypy

  package:
    name: package / build & install check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - name: Build sdist + wheel
        run: python -m build
      - name: Build must be warning-free
        run: |
          # PEP 639 / 元数据废弃警告必须为 0
          out=$(python -m build 2>&1)
          echo "$out" | grep -iE "^warning|deprecat" && { echo "构建出现警告"; exit 1; } || true
          echo "构建无警告"
      - name: Wheel must ship py.typed
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(whl).namelist())
          required = ["marginalia/py.typed", "marginalia/cli.py"]
          missing = [r for r in required if r not in names]
          print("wheel:", whl, "files:", len(names))
          if missing:
              print("MISSING:", missing)
              sys.exit(1)
          PY
      - name: Install from wheel and run
        run: |
          python -m pip install dist/*.whl
          marginalia --version
