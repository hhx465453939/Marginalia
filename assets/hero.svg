<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="Marginalia：书页与页边批注">
  <title>Marginalia · 页边的批注</title>

  <!-- 绢底（禁纯白） -->
  <rect width="1200" height="430" fill="#f5f0e6"/>

  <!-- 页边竖线：一切批注与原文的分界 -->
  <line x1="752" y1="92" x2="752" y2="374" stroke="#d8d0c0" stroke-width="1"/>

  <!-- 书名 -->
  <text x="64" y="120" font-family="'Noto Serif SC','Songti SC',Songti,serif" font-size="30" fill="#2b2b2b" letter-spacing="3">鬼谷子</text>

  <!-- 篇名 -->
  <text x="64" y="150" font-family="'Noto Serif SC','Songti SC',Songti,serif" font-size="14" fill="#6b6257" letter-spacing="2">捭阖第一</text>

  <!-- 篇名下的淡墨线（细分隔，不做卡片） -->
  <line x1="64" y1="168" x2="286" y2="168" stroke="#d8d0c0" stroke-width="1"/>

  <!-- 原文：一字不改的正文 -->
  <g font-family="'Noto Serif SC','Songti SC',Songti,serif" font-size="15" fill="#2b2b2b" letter-spacing="1.2">
    <text x="64" y="208">粤若稽古，圣人之在天地间也，为众生之先。</text>
    <text x="64" y="241">观阴阳之开阖以名命物，知存亡之门户。</text>
    <text x="64" y="274">筹策万类之终始，达人心之理。</text>
    <text x="64" y="307">见变化之朕焉，而守司其门户。</text>
  </g>

  <!-- 页边批注：长在原文旁边的对话 -->
  <g font-family="'Noto Serif SC','Songti SC',Songti,serif" font-size="12.5" fill="#6b6257" letter-spacing="0.8">
    <text x="788" y="204">— 这句是全书的门。</text>
    <text x="788" y="237">— 先稽古，再观阴阳。</text>
    <text x="788" y="270">— 存亡之门户，判断的起点。</text>
  </g>

  <!-- 朱砂印：一处，且参与构图 -->
  <rect x="1098" y="312" width="38" height="38" fill="#c3272b"/>
  <text x="1117" y="338" font-family="'Noto Serif SC','Songti SC',Songti,serif" font-size="19" fill="#f5f0e6" text-anchor="middle">注</text>

  <!-- 页脚：题名与副题 -->
  <text x="64" y="404" font-family="Georgia,'Times New Roman',serif" font-size="12" fill="#6b6257" letter-spacing="7">MARGINALIA</text>
  <text x="752" y="404" font-family="'Noto Serif SC','Songti SC',Songti,serif" font-size="11.5" fill="#6b6257" letter-spacing="1.5" text-anchor="end">每人一间书房 · 同一本书，各自的页边</text>
</svg>
